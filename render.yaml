services:
  - type: web
    name: ikon-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: apt-get update && apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config build-essential && npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APPSTATE
        sync: false
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Optional single-owner shorthand, folded into ADMIN_IDS by
      # bot/permissions.js. Set one or both; both are read from the environment.
      - key: OWNER_ID
        sync: false
      - key: PORT
        value: "3000"
      - key: PREFIX
        value: "!"
